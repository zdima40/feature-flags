name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install --global npm@11.16.0
          npm ci
      - name: Restore backend dependencies
        run: dotnet restore backend/Rollout.slnx --locked-mode

      - name: Build and test backend
        run: |
          dotnet build backend/Rollout.slnx --configuration Release --no-restore
          dotnet test backend/Rollout.slnx --configuration Release --no-build
      - name: Build, lint, format-check and test frontend
        working-directory: frontend
        run: |
          npm run build
          npm run lint
          npm run format:check
          npm run test:ci
          npm run typecheck:e2e

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium
      - name: Run E2E and accessibility tests
        id: e2e
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright failure artifacts
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
